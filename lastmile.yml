- name: Last-mile infrastructure for this environment
  hosts: app
  become: true
  vars_files:
    - vars/dev.yml
  tasks:
    - name: Create service group
      ansible.builtin.group:
        name: appsvc
        system: true

    - name: Create service user
      ansible.builtin.user:
        name: appsvc
        group: appsvc
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create data directory (stands in for mounted storage)
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: appsvc
        group: appsvc
        mode: "0750"

    - name: Create config directory
      ansible.builtin.file:
        path: /etc/app
        state: directory
        owner: root
        group: appsvc
        mode: "0750"

    - name: Write environment file
      ansible.builtin.template:
        src: templates/app.env.j2
        dest: /etc/app/app.env
        owner: root
        group: appsvc
        mode: "0640"
